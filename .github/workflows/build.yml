name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Library
        run: dotnet build src/RimworldMultiplayer.Api/RimworldMultiplayer.Api.csproj -c Release
      - name: Example and add-ons
        shell: pwsh
        run: |
          $failed = @()
          Get-ChildItem examples, mods -Recurse -Filter *.csproj | ForEach-Object {
            dotnet build $_.FullName -c Release -nologo
            if ($LASTEXITCODE -ne 0) { $failed += $_.Name }
          }
          if ($failed) { throw "Failed: $($failed -join ', ')" }
